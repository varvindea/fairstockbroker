<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>fairstockbroker</title>
    <script>
      // Encode the full URL as a query param and redirect to index.html
      // so GitHub Pages doesn't serve a real 404 for client-side routes.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
